name: Build Solarispro offline standalone

on:
  workflow_dispatch:
  push:
    paths:
      - "solarispro/**"
      - ".github/workflows/solarispro-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarispro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install standalone bundler
        run: npm install --no-save vite-plugin-singlefile
      - name: Build single-file offline game
        run: npx vite build --config vite.offline.config.ts
      - name: Verify and prepare standalone HTML
        run: |
          test -s offline-dist/offline.html
          mkdir -p package
          cp offline-dist/offline.html package/index.html
          cp offline-dist/offline.html index.html
          cd package
          zip -9 ../Solarispro-Offline.zip index.html
      - name: Commit generated double-click HTML
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- solarispro/index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add solarispro/index.html
            git commit -m "Publish generated Solarispro offline HTML"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Solarispro-Offline
          path: solarispro/Solarispro-Offline.zip
          if-no-files-found: error
          retention-days: 30
