name: Build Solarispro offline package

on:
  workflow_dispatch:
  push:
    paths:
      - "solarispro/**"
      - ".github/workflows/solarispro-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarispro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solarispro/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Package build output
        working-directory: .
        run: |
          test -d solarispro/dist || (echo "Build did not create solarispro/dist" && exit 1)
          cd solarispro
          zip -r ../Solarispro-build.zip dist
      - name: Upload build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Solarispro-build
          path: Solarispro-build.zip
          if-no-files-found: error
          retention-days: 14
